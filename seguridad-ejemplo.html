<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ejemplo seguro — comprobante</title>
</head>
<body>
  <!--
    EJEMPLO DE ARQUITECTURA SEGURA
    El navegador nunca lista reservas ni decide permisos/expiración.
    Los endpoints /api/* deben ser Edge Functions o un backend con RLS.
  -->
  <main>
    <h1>Subir comprobante</h1>
    <form id="lookup-form">
      <label for="booking-token">Código privado de reserva</label>
      <input id="booking-token" required autocomplete="one-time-code">
      <button>Buscar</button>
    </form>

    <section id="booking" hidden>
      <p id="booking-summary"></p>
      <form id="receipt-form">
        <label for="receipt">Imagen del comprobante</label>
        <input id="receipt" type="file" accept="image/jpeg,image/png,application/pdf" required>
        <button id="upload" type="submit">Enviar comprobante</button>
      </form>
      <p id="message" role="status"></p>
    </section>
  </main>

  <script>
    const MAX_FILE_SIZE = 8 * 1024 * 1024;
    let bookingToken = '';
    let booking = null;

    // Nunca usar innerHTML con datos recibidos del cliente/servidor.
    const text = (id, value) => { document.getElementById(id).textContent = value; };
    const message = value => text('message', value);

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        credentials: 'include'
      });
      if (!response.ok) throw new Error('Solicitud rechazada');
      return response.json();
    }

    document.getElementById('lookup-form').addEventListener('submit', async event => {
      event.preventDefault();
      bookingToken = document.getElementById('booking-token').value.trim();
      if (bookingToken.length < 20 || bookingToken.length > 200) {
        message('El código de reserva no es válido.');
        return;
      }
      try {
        // El servidor valida el token y devuelve solo los datos mínimos.
        booking = await api('/api/bookings/me', {
          method: 'POST', body: JSON.stringify({ token: bookingToken })
        });
        text('booking-summary', `Reserva para ${booking.clientName}, ${booking.date} ${booking.time}.`);
        document.getElementById('booking').hidden = false;
        message('');
      } catch {
        message('No se encontró una reserva válida o ya expiró.');
      }
    });

    document.getElementById('receipt-form').addEventListener('submit', async event => {
      event.preventDefault();
      const file = document.getElementById('receipt').files[0];
      if (!booking || !file) return message('Selecciona un archivo.');
      if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) {
        return message('Solo se permiten JPG, PNG o PDF.');
      }
      if (file.size > MAX_FILE_SIZE) return message('El archivo supera 8 MB.');

      const button = document.getElementById('upload');
      button.disabled = true;
      try {
        // El servidor comprueba token, estado y expiración con su propio reloj.
        const signed = await api('/api/bookings/receipt-upload', {
          method: 'POST', body: JSON.stringify({ token: bookingToken, contentType: file.type, size: file.size })
        });

        // URL firmada y de un solo uso para bucket privado; nunca getPublicUrl().
        const upload = await fetch(signed.uploadUrl, {
          method: 'PUT', headers: { 'Content-Type': file.type }, body: file
        });
        if (!upload.ok) throw new Error('upload');

        // El servidor vuelve a validar el token y cambia solo el estado permitido.
        await api('/api/bookings/receipt-complete', {
          method: 'POST', body: JSON.stringify({ token: bookingToken, objectKey: signed.objectKey })
        });
        message('Comprobante recibido. Quedó pendiente de revisión.');
        document.getElementById('receipt-form').reset();
      } catch {
        message('No se pudo enviar el comprobante. Intenta nuevamente.');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
